name: Publicar en GitHub Pages

# Compila la web con Astro y deja el resultado en la rama gh-pages.
# En GitHub: Settings → Pages → Source: "Deploy from a branch", rama gh-pages, carpeta / (root).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Sin esto, GitHub Pages intentaría procesar la web con Jekyll.
      - run: touch dist/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
